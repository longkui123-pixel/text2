<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>像素药盒 PIXEL DOSE</title>
<meta name="theme-color" content="#17112B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="像素药盒">
<meta name="format-detection" content="telephone=no">
<style>
/* ==========================================================================
   像素药盒 PIXEL DOSE — 像素风吃药提醒 / 单文件离线版
   设计标准：DESIGN_SPEC.md（深色唯一主题 / 无圆角 / 无渐变 / 只用 steps 动效）
   ========================================================================== */

/* ------------------------------ 字体 ------------------------------ */
@font-face{
  font-family:FusionPixel;
  src:url(data:font/woff2;base64,{{FUSION_WOFF2_B64}}) format('woff2');
  font-weight:400;font-style:normal;font-display:block;
}
@font-face{
  font-family:PressStart2P;
  src:url(data:font/woff2;base64,{{PRESS2P_WOFF2_B64}}) format('woff2');
  font-weight:400;font-style:normal;font-display:block;
}

/* ------------------------------ 变量 ------------------------------ */
:root{
  --bg:#17112B; --bg2:#1E1638;
  --surface:#241A45; --surface2:#2D2154; --surface3:#3A2B6B;
  --line:#4B3A84; --line-dark:#0E0A1C;
  --text:#F4EEFF; --text-dim:#B6A4E0; --text-mute:#7F6FA8;
  --mint:#5CF2B6; --peach:#FF9D7A; --gold:#FFD166;
  --lilac:#B388FF; --sky:#7AD7FF; --rose:#FF7EB6;
  --white:#FFFFFF;
  --shadow:#0E0A1C;
  --accent:#5CF2B6;
  --accent-ink:#0E0A1C;
  --cut:6px;
  --cutpath:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  --cutpath-sm:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
  --font-cn:FusionPixel,ui-monospace,'Courier New',monospace;
  --font-num:PressStart2P,ui-monospace,'Courier New',monospace;
}

/* ------------------------------ 基础 ------------------------------ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-cn);
  font-size:12px;line-height:1.6;letter-spacing:.5px;
  overflow:hidden;
  -webkit-font-smoothing:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  touch-action:manipulation;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit;line-height:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:inherit}
h1,h2,h3,h4,p{margin:0;font-weight:400}
ul{margin:0;padding:0;list-style:none}
svg{display:block}
.num{font-family:var(--font-num);letter-spacing:.5px;font-variant-ligatures:none}
.dim{color:var(--text-dim)}
.mute{color:var(--text-mute)}
.nowrap{white-space:nowrap}
.hidden{display:none !important}

/* ------------------------------ App 骨架 ------------------------------ */
#app{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  overflow:hidden;
  background:var(--bg);
  max-width:480px;margin:0 auto;
  border-left:1px solid var(--line-dark);
  border-right:1px solid var(--line-dark);
}

/* 假状态条（仅网页版装饰） */
.statusbar{
  flex:none;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  height:calc(24px + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 14px 0;
  background:var(--bg);
  font-family:var(--font-num);font-size:8px;letter-spacing:.5px;color:var(--text-mute);
}
.statusbar .sb-mid{color:var(--text-dim);font-size:8px;letter-spacing:1px}
.batt{display:flex;align-items:center;gap:2px}
.batt i{display:block;width:3px;height:8px;background:var(--mint)}
.batt i:nth-child(4){background:var(--surface3)}
.batt .bcap{display:block;width:2px;height:4px;background:var(--line);margin-left:1px}

/* 顶部 6px 横线装饰 */
.stripes{
  flex:none;height:6px;
  background-image:repeating-linear-gradient(180deg,var(--line) 0 1px,transparent 1px 3px);
  opacity:.45;
}

/* ------------------------------ 主区域 / 视图 ------------------------------ */
main{flex:1;position:relative;overflow:hidden}
.view{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  display:none;
  background-color:var(--bg);
  background-image:radial-gradient(var(--line-dark) 1px,transparent 1px);
  background-size:4px 4px;
  scrollbar-width:none;
}
.view::-webkit-scrollbar{display:none;width:0;height:0}
.view[data-active="true"]{display:block;animation:viewIn .22s steps(3) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 页头 */
.vhead{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  padding:12px 16px 10px;
  background-color:var(--bg);
  background-image:radial-gradient(var(--line-dark) 1px,transparent 1px);
  background-size:4px 4px;
}
.vhead::after{
  content:'';position:absolute;left:16px;right:16px;bottom:0;height:1px;
  background-image:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  opacity:.75;
}
.htext{min-width:0;flex:1}
.ttl{font-size:18px;line-height:1.2;letter-spacing:1px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{margin-top:5px;font-size:12px;line-height:1.25;color:var(--text-dim);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbody{padding:12px 16px calc(26px + env(safe-area-inset-bottom,0px))}

/* 图标按钮 44×44 */
.icon-btn{
  flex:none;width:44px;height:44px;min-width:44px;
  display:grid;place-items:center;
  color:var(--text-dim);
  background:var(--surface);
  border:2px solid var(--line);
  box-shadow:3px 3px 0 var(--shadow);
  transition:transform .12s steps(2),box-shadow .12s steps(2),color .12s steps(2);
}
.icon-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow);color:var(--text)}
.icon-btn[aria-pressed="true"]{color:var(--mint);border-color:var(--line)}
.icon-btn.bare{background:none;border:0;box-shadow:none}
.icon-btn.bare:active{transform:none;box-shadow:none;background:var(--surface2)}

/* ------------------------------ 卡片 / 区块 ------------------------------ */
.stack{display:flex;flex-direction:column;gap:12px}
.card{
  position:relative;
  background:var(--surface);
  border:2px solid var(--line);
  box-shadow:4px 4px 0 var(--shadow);
}
.card.small{box-shadow:3px 3px 0 var(--shadow)}
.sec{margin-top:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 9px}
.sec-h h2{font-size:14px;letter-spacing:1px;color:var(--text)}
.sec-h .sec-meta{font-size:11px;color:var(--text-mute);letter-spacing:.5px}

/* ------------------------------ 今日：总览 ------------------------------ */
.ov{padding:13px 14px 14px}
.ov-top{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.ov-lab{font-size:11px;letter-spacing:1px;color:var(--text-dim)}
.ov-frac{font-size:13px;color:var(--mint);line-height:1.2}
.ov-top .sp{flex:1}
.streak{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gold);line-height:1}
.streak .sv{width:16px;height:16px;flex:none}
.streak b{font-family:var(--font-num);font-size:11px;font-weight:400;letter-spacing:.5px}

/* 分段进度条 */
.segbar{display:flex;gap:2px;height:12px}
.segbar i{
  flex:1 1 0;min-width:0;height:12px;display:block;
  background:var(--surface3);
  border:1px solid var(--line-dark);
}
.segbar i.on{
  background:var(--mint);border-color:var(--mint);
  animation:segPop .18s steps(2) both;
}
@keyframes segPop{from{transform:scaleY(.35)}to{transform:scaleY(1)}}

/* ------------------------------ 今日：下一次提醒 ------------------------------ */
.hero{padding:12px 14px 14px;background:var(--surface);border-color:var(--line)}
.hero.is-due{border-color:var(--gold)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}
.ls{font-family:var(--font-num);font-size:8px;letter-spacing:1px;color:var(--text-mute);line-height:1.4}
.hero-status{display:flex;align-items:baseline;gap:4px;font-size:11px;line-height:1.3;color:var(--mint)}
.hero-status .num{font-size:10px}
.hero-status.due{color:var(--gold);animation:blink2 1s steps(1) infinite}
@keyframes blink2{0%,60%{opacity:1}61%,100%{opacity:.55}}
.hero-main{display:flex;align-items:center;gap:12px}
.med-tile{
  position:relative;flex:none;width:52px;height:52px;
  display:grid;place-items:center;
  background:var(--surface2);
  border:2px solid var(--line);
  box-shadow:4px 4px 0 var(--shadow);
  color:var(--c,#5CF2B6);
}
.med-tile::after{
  content:'';position:absolute;right:0;bottom:0;width:4px;height:4px;background:var(--edge,var(--c,#5CF2B6));
}
.hero-info{min-width:0;flex:1}
.hero-time{font-family:var(--font-num);font-size:24px;line-height:1.05;color:var(--white);letter-spacing:1px}
.hero-name{font-size:16px;line-height:1.25;color:var(--white);margin-top:7px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-dose{font-size:12px;line-height:1.3;color:var(--text-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-actions{display:flex;align-items:stretch;gap:10px;margin-top:15px}
.hero-actions .cut-wrap{flex:1 1 auto}
.hero-actions .btn-ghost{flex:0 0 96px;height:48px;padding:0 6px;font-size:11px;line-height:1.35}

/* 像素切角主按钮 */
.cut-wrap{position:relative;display:flex;min-height:48px}
.cut-wrap>.cut-shadow{
  position:absolute;top:4px;left:4px;right:-4px;bottom:-4px;
  background:var(--shadow);clip-path:var(--cutpath);
}
.cut-wrap>.cut-btn{
  position:relative;z-index:1;flex:1;
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;height:48px;min-height:48px;
  background:var(--accent);color:var(--accent-ink);
  border:2px solid var(--line-dark);
  clip-path:var(--cutpath);
  font-size:15px;letter-spacing:2px;
  transition:transform .12s steps(2);
}
.cut-wrap>.cut-btn:active{transform:translate(2px,2px)}
.cut-wrap>.cut-btn:disabled{background:var(--surface3);color:var(--text-mute)}

/* 通用按钮 */
.btn-ghost{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:0 12px;
  background:var(--surface3);color:var(--text);
  border:2px solid var(--line);
  box-shadow:3px 3px 0 var(--shadow);
  font-size:12px;letter-spacing:1px;
  transition:transform .12s steps(2),box-shadow .12s steps(2);
}
.btn-ghost:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn-ghost.wide{width:100%;height:48px;font-size:14px}
.btn-mint{background:var(--mint);color:var(--line-dark);border-color:var(--line-dark)}
.btn-peach{background:none;color:var(--peach);border-color:var(--peach);box-shadow:3px 3px 0 var(--shadow)}
.btn-mini{min-height:36px;padding:0 10px;font-size:11px;box-shadow:2px 2px 0 var(--shadow)}

/* ------------------------------ 今日：清单 ------------------------------ */
.dose-row{
  position:relative;display:flex;align-items:center;gap:10px;
  min-height:64px;padding:10px 10px 10px 12px;
  background:var(--surface);border:2px solid var(--line);
  box-shadow:3px 3px 0 var(--shadow);
  transition:transform .12s steps(2),box-shadow .12s steps(2),border-color .12s steps(2);
}
.dose-row+.dose-row{margin-top:10px}
.dose-row[data-status="now"]{border-color:var(--mint);background:var(--surface2)}
.dose-row[data-status="taken"]{background:var(--surface)}
.dose-row[data-status="taken"] .dose-name{color:var(--text-dim)}
.dose-row[data-status="missed"] .dose-time-txt{color:var(--peach)}
.row-press:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.dose-time{flex:none;width:58px;display:flex;flex-direction:column;gap:3px}
.dose-time-txt{font-family:var(--font-num);font-size:12px;line-height:1.2;color:var(--text);letter-spacing:.5px}
.dose-st{font-size:10px;line-height:1.2;letter-spacing:.5px;color:var(--text-mute);white-space:nowrap}
.dose-row[data-status="taken"] .dose-st{color:var(--mint)}
.dose-row[data-status="now"] .dose-st{color:var(--gold)}
.dose-row[data-status="missed"] .dose-st{color:var(--peach)}
.dose-mid{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.dose-name{font-size:14px;line-height:1.25;color:var(--text);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dose-dose{font-size:11px;line-height:1.25;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{
  flex:none;width:44px;height:44px;
  display:grid;place-items:center;
  background:none;border:2px solid var(--line);color:var(--text-dim);
  transition:transform .12s steps(2),background .12s steps(2),border-color .12s steps(2);
}
.chk:active{transform:translate(1px,1px)}
.chk[data-on="1"]{background:var(--mint);border-color:var(--line-dark);color:var(--line-dark)}
.chk[data-late="1"]{border-color:var(--peach);color:var(--peach);font-size:12px;letter-spacing:0}
.chk .chk-word{font-size:12px;letter-spacing:0;line-height:1}

/* 空状态 */
.empty{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:26px 18px 24px;text-align:center;
  background:var(--surface);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);
}
.empty .ill{width:56px;height:56px;display:grid;place-items:center;color:var(--text-mute);background:var(--surface2);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow)}
.empty h3{font-size:15px;letter-spacing:1px;color:var(--text)}
.empty p{font-size:11px;line-height:1.6;color:var(--text-mute);max-width:230px}
.empty .btn-ghost{width:100%;max-width:220px;height:46px;font-size:13px}

/* ------------------------------ 药箱 ------------------------------ */
.med-card{
  position:relative;display:flex;align-items:center;gap:11px;
  min-height:96px;padding:12px 10px 12px 16px;
  background:var(--surface);border:2px solid var(--line);
  box-shadow:3px 3px 0 var(--shadow);
  width:100%;text-align:left;
  transition:transform .12s steps(2),box-shadow .12s steps(2);
}
.med-card+.med-card{margin-top:12px}
.med-card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.med-card .strip{position:absolute;left:-2px;top:-2px;bottom:-2px;width:4px;background:var(--c,#5CF2B6)}
.med-tile-sm{flex:none;width:40px;height:40px;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--line);color:var(--c,#5CF2B6)}
.med-main{flex:1;min-width:0}
.med-name{font-size:16px;line-height:1.25;color:var(--text);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.med-dose{font-size:11px;line-height:1.3;color:var(--text-dim);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--surface3);border:1px solid var(--line);
  padding:2px 6px;font-size:10px;line-height:1.4;color:var(--text-dim);letter-spacing:.5px;
}
.chip .num{font-size:9px;color:var(--white)}
.chip.warn{color:var(--peach);border-color:var(--peach)}
.med-chev{flex:none;width:32px;display:grid;place-items:center;color:var(--text-mute)}

/* ------------------------------ 编辑层 ------------------------------ */
#editor{
  position:fixed;inset:0;z-index:80;
  display:none;flex-direction:column;
  background:var(--bg2);
  max-width:480px;margin:0 auto;
  border-left:1px solid var(--line-dark);border-right:1px solid var(--line-dark);
}
#editor[data-open="true"]{display:flex;animation:sheetIn .24s steps(4) both}
#editor.closing{animation:sheetOut .18s steps(3) both}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes sheetOut{from{transform:translateY(0)}to{transform:translateY(100%)}}
.ehead{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;
  border-bottom:1px dashed var(--line);
}
.ehead .etitle{font-size:15px;letter-spacing:2px;color:var(--white)}
.ehead .side{min-width:64px;display:flex;justify-content:flex-start}
.ehead .side.r{justify-content:flex-end}
.etext-btn{min-height:44px;padding:0 8px;display:inline-flex;align-items:center;font-size:13px;letter-spacing:1px;color:var(--text-dim);transition:transform .12s steps(2)}
.etext-btn:active{transform:translateY(1px)}
.etext-btn.mint{color:var(--mint)}
.ebody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(30px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
.ebody::-webkit-scrollbar{display:none;width:0}
.field{margin-bottom:18px}
.field-lab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:12px;color:var(--text-dim);letter-spacing:1px}
.field-lab .hint{font-size:10px;color:var(--text-mute);letter-spacing:.5px}
.inp{
  display:block;width:100%;height:46px;
  background:var(--surface3);
  border:2px solid var(--line);
  color:var(--text);
  font-family:var(--font-cn);font-size:16px;letter-spacing:.5px;
  padding:0 12px;outline:none;border-radius:0;
  transition:border-color .12s steps(2),box-shadow .12s steps(2);
}
.inp::placeholder{color:var(--text-mute);font-size:14px}
.inp:focus{border-color:var(--mint);box-shadow:3px 3px 0 var(--shadow)}
.inp.shake{animation:shakeX .24s steps(4) both;border-color:var(--peach)}
@keyframes shakeX{0%{transform:translateX(-4px)}25%{transform:translateX(4px)}50%{transform:translateX(-3px)}75%{transform:translateX(3px)}100%{transform:translateX(0)}}

.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.opt{
  position:relative;min-height:44px;aspect-ratio:1/1;
  display:grid;place-items:center;
  background:var(--surface3);border:2px solid var(--line);
  color:var(--text-dim);
  transition:transform .12s steps(2),border-color .12s steps(2),box-shadow .12s steps(2),background .12s steps(2);
}
.opt:active{transform:translate(1px,1px)}
.opt[aria-pressed="true"]{border-color:var(--mint);background:var(--surface2);box-shadow:3px 3px 0 var(--shadow);color:var(--white)}
.opt[aria-pressed="true"]::after{content:'';position:absolute;left:0;bottom:0;width:6px;height:6px;background:var(--mint)}

.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{
  position:relative;width:44px;height:44px;
  display:grid;place-items:center;
  border:2px solid transparent;
  transition:transform .12s steps(2),border-color .12s steps(2),background .12s steps(2);
}
.sw i{display:block;width:24px;height:24px;background:var(--c,#5CF2B6);border:2px solid var(--line-dark)}
.sw:active{transform:translate(1px,1px)}
.sw[aria-pressed="true"]{background:var(--surface3);border-color:var(--line)}

.timerow{display:flex;align-items:center;gap:8px}
.timerow+.timerow{margin-top:8px}
.timeinp{
  flex:1;height:44px;
  background:var(--surface3);border:2px solid var(--line);
  color:var(--white);font-family:var(--font-num);font-size:11px;
  padding:0 10px;text-align:center;outline:none;border-radius:0;
  color-scheme:dark;
  transition:border-color .12s steps(2);
}
.timeinp:focus{border-color:var(--mint)}
.timeinp::-webkit-calendar-picker-indicator{filter:invert(65%) sepia(20%) saturate(400%) hue-rotate(220deg);opacity:.75;cursor:pointer}
.rm{flex:none;width:44px;height:44px;display:grid;place-items:center;background:var(--surface3);border:2px solid var(--peach);color:var(--peach);transition:transform .12s steps(2)}
.rm:active{transform:translate(1px,1px)}
.addtime{
  margin-top:8px;width:100%;height:44px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:none;color:var(--text-dim);
  border:2px dashed var(--line);font-size:12px;letter-spacing:1px;
}
.addtime:active{background:var(--surface2)}

.dayrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{
  height:44px;display:grid;place-items:center;
  background:var(--surface3);border:2px solid var(--line);
  color:var(--text-mute);font-size:12px;letter-spacing:0;
  transition:transform .12s steps(2),background .12s steps(2),color .12s steps(2),border-color .12s steps(2);
}
.day:active{transform:translate(1px,1px)}
.day[aria-pressed="true"]{background:var(--surface2);border-color:var(--mint);color:var(--mint)}

.danger-zone{border-top:1px dashed var(--line);padding-top:16px;margin-top:22px}
.btn-danger{
  width:100%;height:46px;display:flex;align-items:center;justify-content:center;gap:7px;
  background:none;color:var(--peach);
  border:2px solid var(--peach);box-shadow:3px 3px 0 var(--shadow);
  font-size:13px;letter-spacing:1px;
  transition:transform .12s steps(2),box-shadow .12s steps(2);
}
.btn-danger:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
/* ------------------------------ 记录：日历 ------------------------------ */
.cal{padding:10px 10px 12px}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:4px}
.arrow{
  width:44px;height:44px;display:grid;place-items:center;
  color:var(--text-dim);background:none;border:0;flex:none;
  transition:background .12s steps(2),transform .12s steps(2);
}
.arrow:active{background:var(--surface2);transform:translateY(1px)}
.arrow:disabled{color:var(--text-mute);opacity:.45}
.cal-month{display:flex;align-items:baseline;justify-content:center;gap:1px;font-size:14px;letter-spacing:1px;color:var(--white);flex:1;white-space:nowrap}
.cal-month .num{font-size:13px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-wd{height:26px;display:grid;place-items:center;font-size:10px;color:var(--text-mute);letter-spacing:1px}
.cal-cell{
  position:relative;height:50px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:0;
}
.cal-cell[data-empty="1"]{pointer-events:none}
.cal-cell[data-rec="1"]{cursor:pointer}
.cal-cell:active .blk{transform:translate(1px,1px)}
.blk{position:relative;width:26px;height:26px;background:var(--surface3);border:1px solid var(--line);transition:transform .12s steps(2)}
.blk[data-s="full"]{background:var(--mint);border-color:var(--mint);display:grid;place-items:center;color:var(--line-dark)}
.blk[data-s="part"]{background:var(--surface3);border:1px solid var(--line);overflow:hidden}
.blk[data-s="part"]::after{content:'';position:absolute;left:-1px;right:-1px;bottom:-1px;height:50%;background:var(--gold);border-top:1px solid var(--line-dark)}
.blk[data-s="miss"]{background-color:var(--surface3);border:2px solid var(--peach);background-image:repeating-linear-gradient(45deg,var(--peach) 0 1px,transparent 1px 4px)}
.blk[data-s="none"]{background:var(--surface3);border:1px solid var(--line)}
.cal-cell .dnum{font-family:var(--font-num);font-size:8px;line-height:1;color:var(--text-mute);letter-spacing:0}
.cal-cell[data-today="1"] .blk{outline:2px solid var(--gold);outline-offset:1px}
.cal-cell[data-today="1"] .dnum{color:var(--gold)}
.cal-legend{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.lg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-mute);letter-spacing:.5px}
.lg i{display:block;width:10px;height:10px;border:1px solid var(--line)}

/* ------------------------------ 记录：统计 / 柱状图 ------------------------------ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{
  min-height:80px;padding:11px 5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:var(--surface);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);
  text-align:center;
}
.stat .v{display:flex;align-items:baseline;justify-content:center;gap:2px;font-family:var(--font-num);font-size:13px;line-height:1.1}
.stat .v .u{font-family:var(--font-cn);font-size:10px;letter-spacing:0;color:var(--text-dim)}
.stat .k{font-size:10px;color:var(--text-dim);letter-spacing:.5px;line-height:1.2}
.stat.s-mint .v{color:var(--mint)}
.stat.s-gold .v{color:var(--gold)}
.stat.s-lilac .v{color:var(--lilac)}

.chartcard{padding:14px 14px 12px}
.chart{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:88px}
.bcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.btrack{width:14px;height:64px;background:var(--surface3);border:1px solid var(--line-dark);display:flex;align-items:flex-end}
.bfill{width:100%;background:var(--mint);transform-origin:bottom;animation:barGrow .34s steps(5) both}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.blab{font-family:var(--font-cn);font-size:9px;color:var(--text-mute);letter-spacing:0;line-height:1}
.bcol[data-today="1"] .blab{color:var(--gold)}
.bcol[data-today="1"] .btrack{border-color:var(--line)}
.chart-foot{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.chart-foot .cf-t{font-size:11px;color:var(--text-dim)}
.chart-foot .cf-v{font-size:11px;color:var(--mint)}

/* ------------------------------ 设置 ------------------------------ */
.grp{
  background:var(--surface);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);
  padding-bottom:4px;
}
.grp+.grp{margin-top:12px}
.grp-h{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.grp-h .gico{width:16px;height:16px;display:grid;place-items:center;color:var(--text-dim);flex:none}
.grp-h h2{font-size:13px;letter-spacing:1.5px;color:var(--text-dim)}
.srow{display:flex;align-items:center;gap:10px;min-height:52px;padding:4px 14px}
.srow+.srow{border-top:1px dashed var(--line)}
.srow-l{flex:1;min-width:0}
.srow-t{font-size:13px;line-height:1.35;color:var(--text);letter-spacing:.5px}
.srow-s{font-size:10px;line-height:1.45;color:var(--text-mute);margin-top:2px}
.srow-r{flex:none;display:flex;align-items:center;gap:8px}
.srow.tap:active{background:var(--surface2)}
.srow .val{font-size:11px;color:var(--text-mute);letter-spacing:.5px}

.switch{position:relative;width:44px;height:44px;display:grid;place-items:center;flex:none}
.switch .tr{width:40px;height:22px;background:var(--surface3);border:2px solid var(--line);position:relative;transition:background .12s steps(2),border-color .12s steps(2)}
.switch .kb{position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--text-mute);transition:transform .16s steps(3),background .16s steps(2)}
.switch[aria-checked="true"] .tr{background:rgba(92,242,182,.18);border-color:var(--mint)}
.switch[aria-checked="true"] .kb{transform:translateX(18px);background:var(--mint)}

.accent-row{display:flex;gap:10px;align-items:center;padding:10px 14px 14px}
.acc{
  flex:1;height:48px;display:grid;place-items:center;
  background:var(--surface3);border:2px solid var(--line);
  transition:transform .12s steps(2),border-color .12s steps(2);
}
.acc:active{transform:translate(1px,1px)}
.acc i{display:block;width:20px;height:20px;background:var(--c,#5CF2B6);border:2px solid var(--line-dark)}
.acc[aria-pressed="true"]{border-color:var(--c,#5CF2B6);background:var(--surface2);box-shadow:3px 3px 0 var(--shadow)}

.about-lines{padding:2px 14px 12px}
.about-lines p{font-size:10px;line-height:1.7;color:var(--text-mute);letter-spacing:.5px}
.about-lines p+p{margin-top:2px}
.about-name{display:flex;align-items:baseline;gap:8px;padding:10px 14px 2px}
.about-name .an{font-size:14px;letter-spacing:1px;color:var(--white)}
.about-name .av{font-family:var(--font-num);font-size:9px;color:var(--text-mute)}

/* ------------------------------ 底部 tab ------------------------------ */
.tabbar{
  flex:none;z-index:40;display:flex;
  background:var(--surface);
  border-top:2px solid var(--line);
  box-shadow:0 -3px 0 var(--line-dark);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tab{
  position:relative;flex:1;min-width:0;height:60px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--text-mute);
  transition:background .12s steps(2),color .12s steps(2);
}
.tab .sv{width:20px;height:20px;display:grid;place-items:center}
.tab .tl{font-size:10px;letter-spacing:1px;line-height:1;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--mint);background:var(--surface2)}
.tab[aria-selected="true"]::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:32px;height:2px;background:var(--mint)}
.tab:active{transform:translateY(1px)}

/* ------------------------------ Toast ------------------------------ */
#toasts{
  position:fixed;left:0;right:0;top:calc(34px + env(safe-area-inset-top,0px));
  z-index:95;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:0 16px;pointer-events:none;
}
.toast{
  pointer-events:auto;max-width:100%;
  display:flex;align-items:center;gap:9px;
  background:var(--mint);color:var(--line-dark);
  border:2px solid var(--line-dark);box-shadow:4px 4px 0 var(--line-dark);
  padding:8px 10px;font-size:12px;letter-spacing:.5px;line-height:1.35;
  animation:toastIn .18s steps(3) both;
}
.toast.out{animation:toastOut .16s steps(2) both}
.toast.gold{background:var(--gold)}
.toast.peach{background:var(--peach)}
.toast.plain{background:var(--surface2);color:var(--text);border-color:var(--line)}
.toast .t-ico{width:16px;height:16px;flex:none;display:grid;place-items:center}
.toast .t-txt{flex:1;min-width:0;padding:1px 0}
.toast .t-act{
  flex:none;padding:0 8px;min-height:28px;
  display:grid;place-items:center;
  background:var(--line-dark);color:var(--mint);font-size:11px;letter-spacing:1px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-6px)}}

/* ------------------------------ 提醒横幅 ------------------------------ */
#banner{
  position:fixed;left:0;right:0;top:calc(6px + env(safe-area-inset-top,0px));
  z-index:96;display:none;padding:0 10px;
  max-width:480px;margin:0 auto;
}
#banner[data-open="true"]{display:block;animation:bannerIn .22s steps(3) both}
@keyframes bannerIn{from{transform:translateY(-110%)}to{transform:translateY(0)}}
#banner .bn{background:var(--surface2);border:2px solid var(--gold);box-shadow:5px 5px 0 var(--line-dark);padding:11px 12px}
#banner .bn-top{display:flex;align-items:center;gap:8px}
#banner .bn-top .bn-lab{font-family:var(--font-num);font-size:8px;letter-spacing:1px;color:var(--gold)}
#banner .bn-top .bn-x{margin-left:auto;width:28px;height:28px;display:grid;place-items:center;color:var(--text-dim)}
#banner .bn-main{display:flex;align-items:center;gap:10px;margin-top:9px}
#banner .bn-time{font-family:var(--font-num);font-size:16px;color:var(--white);line-height:1.1}
#banner .bn-name{font-size:14px;color:var(--white);line-height:1.3;margin-top:4px}
#banner .bn-dose{font-size:11px;color:var(--text-dim);margin-top:2px}
#banner .bn-acts{display:flex;gap:8px;margin-top:11px}
#banner .bn-acts button{flex:1}

/* ------------------------------ 像素弹窗 ------------------------------ */
.modal{
  position:fixed;inset:0;z-index:97;display:none;
  place-items:center;padding:22px;
  background:rgba(14,10,28,.8);
}
.modal[data-open="true"]{display:grid;animation:scrimIn .16s steps(2) both}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
.dialog{
  width:100%;max-width:322px;
  background:var(--surface);border:2px solid var(--line);
  box-shadow:6px 6px 0 var(--line-dark);
  padding:16px;animation:dialogIn .2s steps(3) both;
}
@keyframes dialogIn{from{transform:translateY(12px)}to{transform:translateY(0)}}
.dialog h3{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:1px;color:var(--white);line-height:1.3}
.dialog h3 .dico{width:20px;height:20px;flex:none;display:grid;place-items:center;color:var(--peach)}
.dialog p{margin-top:10px;font-size:12px;line-height:1.7;color:var(--text-dim);letter-spacing:.5px}
.dialog .acts{display:flex;gap:8px;margin-top:18px}
.dialog .acts button{flex:1;height:44px;font-size:13px;letter-spacing:1px}

/* ------------------------------ 天明细 sheet ------------------------------ */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(14,10,28,.72);
  opacity:0;pointer-events:none;
  transition:opacity .16s steps(2);
}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  max-width:480px;margin:0 auto;
  background:var(--bg2);
  border:2px solid var(--line);border-bottom:0;
  box-shadow:0 -4px 0 var(--line-dark);
  display:none;flex-direction:column;max-height:74%;
}
.sheet[data-open="true"]{display:flex;animation:sheetUp .22s steps(4) both}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-h{
  flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  padding:12px 12px 11px 14px;border-bottom:1px dashed var(--line);
}
.sheet-h h3{font-size:14px;letter-spacing:1px;color:var(--white);line-height:1.3}
.sheet-h .dsub{font-size:10px;color:var(--text-mute);margin-top:3px;letter-spacing:.5px}
.sheet-x{flex:none;width:36px;height:36px;display:grid;place-items:center;color:var(--text-dim);background:var(--surface3);border:2px solid var(--line)}
.sheet-x:active{transform:translate(1px,1px)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.det-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.det-row:first-child{border-top:0}
.det-time{flex:none;width:50px;font-family:var(--font-num);font-size:11px;line-height:1.2;color:var(--text)}
.det-main{flex:1;min-width:0}
.det-name{font-size:13px;line-height:1.3;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.det-dose{font-size:10px;line-height:1.3;color:var(--text-mute);margin-top:2px}
.det-tag{flex:none;font-size:10px;letter-spacing:.5px;padding:3px 6px;border:1px solid;line-height:1.4}
.det-tag.t{color:var(--mint);border-color:var(--mint)}
.det-tag.m{color:var(--peach);border-color:var(--peach)}
.det-tag.p{color:var(--text-mute);border-color:var(--line)}
.det-sum{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px;font-size:11px;color:var(--text-dim)}

/* ------------------------------ 粒子 ------------------------------ */
#fx{position:fixed;inset:0;z-index:94;pointer-events:none;overflow:hidden}
.pt{position:absolute;width:3px;height:3px;animation:burst .52s steps(8) both}
@keyframes burst{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}

/* ------------------------------ 杂项 ------------------------------ */
.divider{height:1px;background-image:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);opacity:.8;margin:14px 0}
.tiny{font-size:10px;color:var(--text-mute);line-height:1.65;letter-spacing:.5px}
.center{text-align:center}
.mt8{margin-top:8px}
.mt12{margin-top:12px}
.foot-note{padding:14px 4px 0;text-align:center;font-size:10px;color:var(--text-mute);letter-spacing:.5px;line-height:1.7}

/* ------------------------------ 补充：动态内容样式 ------------------------------ */
/* 连击火焰 2 帧 */
.flame{position:relative;display:block;width:16px;height:16px;flex:none}
.flame .fa,.flame .fb{position:absolute;inset:0;display:block}
.flame .fa{animation:fswapA 1.1s steps(1) infinite}
.flame .fb{opacity:0;animation:fswapB 1.1s steps(1) infinite}
@keyframes fswapA{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fswapB{0%,49%{opacity:0}50%,100%{opacity:1}}
.streak span{font-size:12px;color:var(--gold)}

/* 今日全部完成 */
.done{padding:16px 14px}
.done-wrap{display:flex;align-items:center;gap:12px}
.done-ill{flex:none;width:52px;height:52px;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow)}
.done-txt{flex:1;min-width:0}
.done-t{font-size:15px;letter-spacing:1px;color:var(--white);line-height:1.3}
.done-s{font-size:11px;color:var(--text-dim);margin-top:5px;line-height:1.3}
.done-stars{flex:none;color:var(--gold);display:grid;place-items:center;padding-right:2px}
.hero.is-late{border-color:var(--peach)}
.hero-status.late{color:var(--peach);animation:none}

/* 行内块级 span（button 内不能放 div） */
.med-main>span{display:block}
.med-name,.med-dose{display:block}
.dose-meta{min-width:0;flex:1}
.det-main>span{display:block}
.bn-info{display:flex;flex-direction:column;min-width:0;flex:1}
.bn-tile{flex:none;width:36px;height:36px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line)}

/* 日历图例小块 */
.lg i{position:relative;overflow:hidden;display:block;width:10px;height:10px;background:var(--surface3);border:1px solid var(--line)}
.lg i[data-s="full"]{background:var(--mint);border-color:var(--mint)}
.lg i[data-s="part"]::after{content:'';position:absolute;left:0;right:0;bottom:0;height:50%;background:var(--gold)}
.lg i[data-s="miss"]{border-color:var(--peach);background-image:repeating-linear-gradient(45deg,var(--peach) 0 1px,transparent 1px 3px)}

/* 柱状图 */
.btrack{overflow:hidden}
.bfill{display:block}

/* 可点行 */
.srow.tap{cursor:pointer}
.cal-cell:disabled{cursor:default}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="app">
  <!-- ================= 假状态条 ================= -->
  <div class="statusbar" aria-hidden="true">
    <span id="sb-time">00:00</span>
    <span class="sb-mid">PIXEL DOSE</span>
    <span class="batt"><i></i><i></i><i></i><i></i><b class="bcap"></b></span>
  </div>
  <div class="stripes" aria-hidden="true"></div>

  <main>
    <!-- ================= 今日 ================= -->
    <section id="view-today" class="view" data-active="true" aria-label="今日">
      <div class="vhead">
        <div class="htext">
          <h1 class="ttl">今天</h1>
          <p class="sub" id="today-sub">11月8日 周六 · 晚安</p>
        </div>
        <button class="icon-btn" id="bell-btn" type="button" aria-label="通知设置" data-icon="bell" data-size="20"></button>
      </div>
      <div class="vbody">
        <div class="card ov" id="ov-card">
          <div class="ov-top">
            <span class="ov-lab">今日</span>
            <span class="ov-frac num" id="ov-frac">0/0</span>
            <span class="sp"></span>
            <span class="streak" id="ov-streak"></span>
          </div>
          <div class="segbar" id="ov-bar"></div>
        </div>

        <div class="sec" id="next-sec"><div id="next-card"></div></div>

        <div class="sec" id="list-sec">
          <div class="sec-h"><h2>今日清单</h2><span class="sec-meta" id="list-meta"></span></div>
          <div id="dose-list"></div>
        </div>

        <p class="foot-note" id="today-foot"></p>
      </div>
    </section>

    <!-- ================= 药箱 ================= -->
    <section id="view-cabinet" class="view" data-active="false" aria-label="药箱">
      <div class="vhead">
        <div class="htext">
          <h1 class="ttl">药箱</h1>
          <p class="sub" id="cab-sub"></p>
        </div>
        <button class="icon-btn" id="add-med" type="button" aria-label="添加药品" data-icon="plus" data-size="20"></button>
      </div>
      <div class="vbody"><div id="cab-list"></div></div>
    </section>

    <!-- ================= 记录 ================= -->
    <section id="view-history" class="view" data-active="false" aria-label="记录">
      <div class="vhead">
        <div class="htext">
          <h1 class="ttl">记录</h1>
          <p class="sub" id="hist-sub"></p>
        </div>
      </div>
      <div class="vbody">
        <div class="card cal">
          <div class="cal-top">

/* =====================================================================

function blankGrid() {

function art(rows) {

  for (let i = 0; i < h; i++) {

/* ---------- 图标 → SVG ---------- */
const UI_PAL = { o: LINE_DARK, a: 'currentColor', b: LINE_DARK, l: 'currentColor', w: 'currentColor' };

function spriteSvg(name, size, pal) {
  const g = iconGrid(name);
  if (!g) return '';

  const colors = {
    o: P.o || LINE_DARK,
    a: P.a || 'currentColor',
    b: P.b || (P.a || 'currentColor'),
    l: P.l || (P.a || 'currentColor'),
    w: P.w || '#FFFFFF'
  };
  let out = '';
  for (let y = 0; y < 16; y++) {
    let x = 0;
    while (x < 16) {
      const ch = g[y][x];
      if (ch === '.') { x++; continue; }
      let n = 1;
      while (x + n < 16 && g[y][x + n] === ch) n++;
      out += '<rect x="' + x + '" y="' + y + '" width="' + n + '" height="1" fill="' + (colors[ch] || '#fff') + '"/>';
      x += n;
    }
  }
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" focusable="false">' + out + '</svg>';
}
function uiIcon(name, size, color) {

}
function medIcon(kind, size, colorName) {

}
function bangIcon(name, size, color) {

  return spriteSvg(name, size || 16, { o: color || LINE_DARK, a: color || LINE_DARK, b: color || LINE_DARK, l: color || LINE_DARK, w: color || LINE_DARK });
}

/* 给静态标记里的 [data-icon] 注入 SVG */
function hydrateIcons(root) {
  $$('[data-icon]', root || document).forEach(function (el) {
    const name = el.getAttribute('data-icon');
    const size = parseInt(el.getAttribute('data-size') || '16', 10);
    if (el.__ico === name + ':' + size) return;
    el.innerHTML = uiIcon(name, size);
    el.__ico = name + ':' + size;
  });
}

  arr.forEach(function (t) {
    const v = normTime(t);
    if (!seen[v]) { seen[v] = 1; out.push(v); }
  });
  out.sort(function (a, b) { return parseHM(a) - parseHM(b); });
  return out;
}

function sanitizeMed(m) {
  if (!m || typeof m !== 'object') return null;
  const name = typeof m.name === 'string' ? m.name.trim().slice(0, 24) : '';
  if (!name) return null;
  let times = Array.isArray(m.times)
    ? m.times.filter(function (t) { return typeof t === 'string' && /^\d{1,2}:\d{2}/.test(t); })
    : [];
  times = times.length ? uniqTimes(times) : ['08:00'];
  let days = Array.isArray(m.days) ? m.days.filter(function (d) { return d >= 1 && d <= 7; }) : [];
  days = days.length ? Array.from(new Set(days)).sort(function (a, b) { return a - b; }) : ALL_DAYS.slice();
  return {
    id: (typeof m.id === 'string' && m.id) ? m.id : newMedId(),
    name: name,
    dose: typeof m.dose === 'string' ? m.dose.slice(0, 24) : '',
    icon: ICON_KINDS.indexOf(m.icon) >= 0 ? m.icon : 'capsule',
    color: MED_COLORS.indexOf(m.color) >= 0 ? m.color : 'mint',

function loadState() {
  let raw = null;

    const meds = o.meds.map(sanitizeMed).filter(Boolean);
    const logs = {};
    Object.keys(o.logs).forEach(function (dk) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dk)) return;
      const day = o.logs[dk];
      if (!day || typeof day !== 'object') return;
      const kept = {};
      Object.keys(day).forEach(function (k) {
        const l = day[k];
        if (!l || typeof l !== 'object') return;
        if (typeof l.medId !== 'string' || typeof l.time !== 'string') return;
        kept[k] = {
          medId: l.medId,
          time: l.time,
          date: dk,
          takenAt: typeof l.takenAt === 'number' ? l.takenAt : null,
          status: l.status === 'taken' ? 'taken' : 'skipped'
        };
      });
      if (Object.keys(kept).length) logs[dk] = kept;
    });
    const raw2 = (o.settings && typeof o.settings === 'object') ? o.settings : {};
    const settings = {
      sound: raw2.sound !== false,
      vibrate: raw2.vibrate !== false,
      accent: ACCENTS.indexOf(raw2.accent) >= 0 ? raw2.accent : 'mint',
      notify: !!raw2.notify,
      remindAfterMiss: raw2.remindAfterMiss !== false
    };
    return { meds: meds, logs: logs, settings: settings, seeded: !!o.seeded };
  } catch (e) {
    return null;   /* 数据损坏 → 安全回退到演示数据 */
  }
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function demoMeds() {
  const t = Date.now();
  return [
    { id: 'med_demo_d3',  name: '维生素 D3', dose: '800 IU · 1 粒', icon: 'capsule', color: 'gold',  times: ['08:30'],          days: ALL_DAYS.slice(), note: '随早餐吃', createdAt: t - 86400000 * 30 },
    { id: 'med_demo_met', name: '二甲双胍',  dose: '0.5g · 1 片',   icon: 'tablet',  color: 'mint',  times: ['09:00', '21:00'], days: ALL_DAYS.slice(), note: '',         createdAt: t - 86400000 * 28 },
    { id: 'med_demo_ca',  name: '钙镁片',    dose: '2 片',          icon: 'tablet',  color: 'lilac', times: ['13:00'],          days: ALL_DAYS.slice(), note: '',         createdAt: t - 86400000 * 26 },
    { id: 'med_demo_pb',  name: '益生菌',    dose: '1 袋',          icon: 'powder',  color: 'peach', times: ['20:00'],          days: ALL_DAYS.slice(), note: '冷藏保存', createdAt: t - 86400000 * 24 }
  ];
}
function doseListFor(dateObj, meds) {
  const wi = weekIndex(dateObj);
  const dk = dateKey(dateObj);
  const out = [];
  meds.forEach(function (m) {
    if (m.days.indexOf(wi) < 0) return;
    m.times.forEach(function (t) {
      out.push({ doseId: m.id + '@' + t, medId: m.id, time: t, med: m, date: dk });
    });
  });
  out.sort(function (a, b) {
    const d = parseHM(a.time) - parseHM(b.time);
    return d || ((a.med.createdAt || 0) - (b.med.createdAt || 0));
  });
  return out;
}
function buildDemo() {
  const rand = mulberry32(20261108);
  const now = new Date();
  const meds = demoMeds();
  const logs = {};
  const streakLen = 5 + Math.floor(rand() * 5);   /* 5–9 天连击 */

  for (let d = 1; d <= 13; d++) {
    const dateObj = shiftDay(now, -d);
    const dk = dateKey(dateObj);
    const doses = doseListFor(dateObj, meds);
    const dayLogs = {};
    const skipIdx = (d <= streakLen) ? -1 : Math.floor(rand() * doses.length);
    doses.forEach(function (dose, i) {
      if (i === skipIdx) return;   /* 没记录 = 已错过 */
      const mins = parseHM(dose.time);
      const base = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate(), Math.floor(mins / 60), mins % 60, 0, 0).getTime();
      const late = rand() < 0.12 ? (98 + Math.floor(rand() * 55)) : Math.floor(rand() * 35);
      dayLogs[dose.doseId] = { medId: dose.medId, time: dose.time, date: dk, takenAt: base + late * 60000, status: 'taken' };
    });
    logs[dk] = dayLogs;
  }

  /* 今天：只把已经过去的剂次标记为已吃 / 错过，未来的留待吃 */
  const todayK = dateKey(now);
  const nowMin = nowMinutes(now);
  const tDoses = doseListFor(now, meds);
  const past = tDoses.filter(function (d) { return parseHM(d.time) <= nowMin; });
  let missedIdx = -1;
  if (past.length >= 4) missedIdx = past.length - 2;
  else if (past.length === 3) missedIdx = past.length - 1;
  const todayLogs = {};
  past.forEach(function (dose) {
    if (missedIdx >= 0 && dose === past[missedIdx]) return;
    const mins = parseHM(dose.time);
    const base = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Math.floor(mins / 60), mins % 60, 0, 0).getTime();
    const elapsed = Math.floor((now.getTime() - base) / 60000);
    const late = Math.min(Math.floor(rand() * 20) + 2, Math.max(1, elapsed - 1));
    todayLogs[dose.doseId] = { medId: dose.medId, time: dose.time, date: todayK, takenAt: base + late * 60000, status: 'taken' };
  });
  logs[todayK] = todayLogs;

  return { meds: meds, logs: logs, settings: defaultSettings(), seeded: true };
}

/* =====================================================================
   5. 派生数据
   ===================================================================== */
function getLog(dk, doseId) {
  const day = state && state.logs ? state.logs[dk] : null;
  return day ? (day[doseId] || null) : null;
}
function ensureLogs(dk) {
  if (!state.logs[dk]) state.logs[dk] = {};
  return state.logs[dk];
}
function findMed(id) {
  for (let i = 0; i < state.meds.length; i++) if (state.meds[i].id === id) return state.meds[i];
  return null;
}
function dosesForDate(dateObj) { return doseListFor(dateObj, state.meds); }
function doseStatus(dose, nowMin) {
  const log = getLog(dose.date, dose.doseId);
  if (log && log.status === 'taken') return 'taken';
  const todayK = dateKey(new Date());
  const dm = parseHM(dose.time);
  if (dose.date !== todayK) return dose.date < todayK ? 'missed' : 'todo';
  const nm = (nowMin == null) ? nowMinutes() : nowMin;
  if (nm < dm) return 'todo';
  if (nm < dm + 90) return 'now';
  return 'missed';
}
function isDayComplete(dk) {
  const doses = dosesForDate(keyToDate(dk));
  if (!doses.length) return false;
  return doses.every(function (d) {
    const l = getLog(dk, d.doseId);
    return !!(l && l.status === 'taken');
  });
}
function streakDays() {
  let n = 0;
  const today = new Date();
  if (isDayComplete(dateKey(today))) n++;
  for (let i = 1; i < 120; i++) {
    const d = shiftDay(today, -i);
    if (isDayComplete(dateKey(d))) n++;
    else break;
  }
  return n;
}
function doseBaseTs(dk, timeStr) {
  const d = keyToDate(dk);
  const mins = parseHM(timeStr);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(mins / 60), mins % 60, 0, 0).getTime();
}
function onTimeRate() {
  let taken = 0, ontime = 0;
  Object.keys(state.logs).forEach(function (dk) {
    const day = state.logs[dk];
    if (!day) return;
    Object.keys(day).forEach(function (k) {
      const l = day[k];
      if (!l || l.status !== 'taken') return;
      taken++;
      if (typeof l.takenAt === 'number' && (l.takenAt - doseBaseTs(dk, l.time)) <= 90 * 60000) ontime++;
    });
  });
  return taken ? Math.round(ontime / taken * 100) : 0;
}
function monthTakenCount(y, m) {
  let n = 0;
  Object.keys(state.logs).forEach(function (dk) {
    const d = keyToDate(dk);
    if (d.getFullYear() !== y || d.getMonth() !== m) return;
    const day = state.logs[dk] || {};
    Object.keys(day).forEach(function (k) {
      const l = day[k];
      if (l && l.status === 'taken') n++;
    });
  });
  return n;
}
function dailyDoseCount() {
  return state.meds.reduce(function (n, m) { return n + m.times.length; }, 0);
}
function dayInfo(dk, dateObj, todayK) {
  const doses = dosesForDate(dateObj);
  if (!doses.length) return { state: 'none', rec: false, taken: 0, total: 0 };
  const nowMin = nowMinutes();
  let taken = 0, missed = 0;
  doses.forEach(function (d) {
    const l = getLog(dk, d.doseId);
    if (l && l.status === 'taken') { taken++; return; }
    if (doseStatus(d, nowMin) === 'missed') missed++;
  });
  let st = 'none';
  if (taken === doses.length) st = 'full';
  else if (missed > 0) st = 'miss';
  else if (taken > 0) st = 'part';
  return { state: st, rec: (taken > 0 || missed > 0), taken: taken, total: doses.length, missed: missed };
}
function pickNextDose(doses, nowMin) {
  for (let i = 0; i < doses.length; i++) {
    const d = doses[i];
    const s = doseStatus(d, nowMin);
    if (s === 'taken') continue;
    const until = snoozeUntil[d.doseId];
    if (until && until > Date.now()) return { dose: d, status: 'snooze', until: until };
    return { dose: d, status: s };
  }
  return null;
}

    + '<div class="stat s-lilac"><span class="v">' + mc + '<span class="u">次</span></span><span class="k">本月完成</span></div>';

  let bars = '', sumTaken = 0, sumDoses = 0;
  for (let i = 6; i >= 0; i--) {
    const dObj = shiftDay(now, -i);
    const dk = dateKey(dObj);
    const doses = dosesForDate(dObj);
    let takenN = 0;
    doses.forEach(function (d) {
      const l = getLog(dk, d.doseId);
      if (l && l.status === 'taken') takenN++;
    });
    const ratio = doses.length ? takenN / doses.length : 0;
    sumTaken += takenN;
    sumDoses += doses.length;
    const isToday = dk === todayK;
    bars += '<div class="bcol" data-today="' + (isToday ? '1' : '0') + '">'
      + '<span class="btrack"><i class="bfill" style="height:' + Math.round(64 * ratio) + 'px"></i></span>'
      + '<span class="blab">' + (isToday ? '今' : weekdayCN(dObj)) + '</span></div>';
  }
  $('#chart').innerHTML = bars;
  const pct = sumDoses ? Math.round(sumTaken / sumDoses * 100) : 0;
  $('#chart-meta').textContent = '完成率 ' + pct + '%';
  $('#chart-foot').innerHTML = '<span class="cf-t">近 7 天完成 ' + sumTaken + '/' + sumDoses + ' 剂</span>'
    + '<span class="cf-v">' + pct + '%</span>';

  $('#hist-sub').textContent = '按时率 ' + rate + '% · 连续 ' + sk + ' 天';
}

function toast(text, kind, opts) {
  opts = opts || {};

  if (!host) return null;

  d.className = 'toast' + (kind ? ' ' + kind : '');
  const icoColor = (kind === 'plain') ? '#5CF2B6' : LINE_DARK;
  d.innerHTML = '<span class="t-ico">' + uiIcon(opts.icon || 'check', 16, icoColor) + '</span>'
    + '<span class="t-txt">' + esc(text) + '</span>'
    + (opts.action ? '<button class="t-act" type="button">' + esc(opts.action) + '</button>' : '');
  host.appendChild(d);
  function kill() {
    if (!d.parentNode) return;
    d.classList.add('out');
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 190);
  }
  const timer = setTimeout(kill, opts.ttl || 2400);
  if (opts.action && opts.onAction) {
    const b = d.querySelector('.t-act');
    if (b) b.addEventListener('click', function () { clearTimeout(timer); kill(); opts.onAction(); });
  }
  return d;
}

    function done(v) {
      m.setAttribute('data-open', 'false');
      m.innerHTML = '';

      resolve(v);
    }
    m.onclick = function (ev) {
      const b = ev.target.closest ? ev.target.closest('[data-ok]') : null;
      if (b) { done(b.getAttribute('data-ok') === '1'); return; }

function burstParticles(anchor) {
  const fx = $('#fx');
  if (!fx) return;
  let x = window.innerWidth / 2, y = 180;
  if (anchor && anchor.getBoundingClientRect) {
    const r = anchor.getBoundingClientRect();
    x = r.left + r.width / 2;
    y = r.top + r.height / 2;
  }
  const cols = ['#5CF2B6', '#FFD166', '#FFFFFF', '#B388FF'];
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('i');
    p.className = 'pt';
    const ang = (Math.PI * 2 * i / 12) + (Math.random() * 0.5 - 0.25);
    const dist = 26 + Math.random() * 32;
    p.style.left = (x - 1.5) + 'px';
    p.style.top = (y - 1.5) + 'px';
    p.style.background = cols[i % cols.length];
    p.style.setProperty('--dx', Math.round(Math.cos(ang) * dist) + 'px');
    p.style.setProperty('--dy', Math.round(Math.sin(ang) * dist) + 'px');
    p.style.animationDelay = ((i % 4) * 18) + 'ms';
    fx.appendChild(p);
    (function (el) {
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 700);
    })(p);
  }
}

/* =====================================================================
   8. 音效（WebAudio 方波）
   ===================================================================== */
let actx = null;
let ringTimer = null;

function audioCtx() {
  if (actx) return actx;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
  } catch (e) { actx = null; }
  return actx;
}
function playNote(ctx, freq, at, dur, vol) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(vol, at + 0.006);
  g.gain.linearRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(at); o.stop(at + dur + 0.03);
}
function chime(loop) {
  if (!state || !state.settings.sound) return;
  const ctx = audioCtx();
  if (!ctx) return;
  if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
  const notes = [880, 1174, 1568];
  const t0 = ctx.currentTime + 0.03;
  const reps = loop ? 4 : 1;
  for (let r = 0; r < reps; r++) {
    for (let i = 0; i < notes.length; i++) {
      playNote(ctx, notes[i], t0 + (r * notes.length + i) * 0.09, 0.075, 0.09);
    }
  }
}
function startRing() {
  stopRing();
  chime(true);
  ringTimer = setInterval(function () { chime(true); }, 1400);
  setTimeout(stopRing, 8200);
}
function stopRing() {
  if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
}
function vibrate(ms) {
  if (!state || !state.settings.vibrate) return;
  try { if (navigator.vibrate) navigator.vibrate(ms || 22); } catch (e) {}
}

   ===================================================================== */
function doseByDoseId(doseId, dateStr) {
  const dk = dateStr || dateKey(new Date());
  const doses = dosesForDate(keyToDate(dk));
  for (let i = 0; i < doses.length; i++) if (doses[i].doseId === doseId) return doses[i];
  return null;
}
function refreshAfterDoseChange() {
  renderToday();
  renderCabinet();
  renderHistory();
}
function checkDose(doseId, anchor) {
  const dose = doseByDoseId(doseId);
  if (!dose) return false;
  const log = getLog(dose.date, dose.doseId);
  if (log && log.status === 'taken') return true;
  const wasMissed = doseStatus(dose) === 'missed';
  ensureLogs(dose.date)[dose.doseId] = {
    medId: dose.medId, time: dose.time, date: dose.date, takenAt: Date.now(), status: 'taken'
  };
  delete snoozeUntil[dose.doseId];
  save();
  refreshAfterDoseChange();
  burstParticles(anchor);
  chime(false);
  vibrate(22);
  toast((wasMissed ? '补卡成功 · ' : '打卡成功 · ') + dose.med.name, 'mint', { icon: 'check' });
  if (isDayComplete(dose.date)) {
    setTimeout(function () { toast('今日全部完成 · 干得好', 'gold', { icon: 'star', ttl: 2200 }); }, 420);
  }
  return true;
}
function uncheckDose(doseId) {
  const dose = doseByDoseId(doseId);
  if (!dose) return false;
  const day = state.logs[dose.date];
  if (!day || !day[dose.doseId]) return false;
  const medName = dose.med.name;
  delete day[dose.doseId];
  if (!Object.keys(day).length) delete state.logs[dose.date];
  save();
  refreshAfterDoseChange();
  vibrate(12);
  toast('已取消打卡 · ' + medName, 'peach', {
    icon: 'undo', ttl: 2800, action: '撤销',
    onAction: function () { checkDose(doseId); }
  });
  return true;
}
function toggleCheck(doseId, anchor) {
  const dose = doseByDoseId(doseId);
  if (!dose) return;
  const log = getLog(dose.date, dose.doseId);
  if (log && log.status === 'taken') uncheckDose(doseId);
  else checkDose(doseId, anchor);
}
function snoozeDose(doseId) {
  const dose = doseByDoseId(doseId);
  if (!dose) return;
  snoozeUntil[doseId] = Date.now() + 10 * 60000;
  renderToday();
  toast('已稍后 10 分钟 · ' + dose.med.name, 'plain', { icon: 'clock', ttl: 2200 });
}

  if (!state || !state.settings.notify) return;

  if (Notification.permission !== 'granted') return;
  try { new Notification(title, { body: body, tag: 'pixel-dose' }); } catch (e) {}

function checkDue(now) {
  const dk = dateKey(now);
  if (!notifiedMap[dk]) notifiedMap[dk] = {};
  const doses = dosesForDate(now);
  const secs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  for (let i = 0; i < doses.length; i++) {
    const dose = doses[i];
    if (notifiedMap[dk][dose.doseId]) continue;
    const log = getLog(dk, dose.doseId);
    if (log && log.status === 'taken') continue;
    const diff = secs - parseHM(dose.time) * 60;
    if (diff >= -30 && diff <= 30) {
      notifiedMap[dk][dose.doseId] = 1;
      showBanner(dose);
      return;
    }
    if (state.settings.remindAfterMiss && diff > 900 - 30 && diff < 900 + 30) {
      notifiedMap[dk][dose.doseId] = 1;
      showBanner(dose);
      return;
    }
  }
}

  let html = '';
  html += '<div class="field"><div class="field-lab"><span>名称</span><span class="hint">必填</span></div>'
    + '<input class="inp" id="ed-name" type="text" maxlength="24" placeholder="例如：维生素 D3" autocomplete="off" value="' + esc(d.name) + '"></div>';
  html += '<div class="field"><div class="field-lab"><span>剂量</span><span class="hint">可选</span></div>'
    + '<input class="inp" id="ed-dose" type="text" maxlength="24" placeholder="1 片 / 0.5g" autocomplete="off" value="' + esc(d.dose) + '"></div>';
  html += '<div class="field"><div class="field-lab"><span>图标</span></div><div class="grid6" id="ed-icons">' + p.icons + '</div></div>';
  html += '<div class="field"><div class="field-lab"><span>颜色</span></div><div class="swatches" id="ed-colors">' + p.colors + '</div></div>';
  html += '<div class="field"><div class="field-lab"><span>提醒时间</span><span class="hint" id="ed-time-hint">' + (d.times.length > 1 ? ('共 ' + d.times.length + ' 次') : '至少 1 个') + '</span></div>'
    + '<div id="ed-times">' + timesHTML() + '</div></div>';
  html += '<div class="field"><div class="field-lab"><span>重复</span><span class="hint" id="ed-days-hint">' + daysLabel(d.days) + '</span></div>'
    + '<div class="dayrow" id="ed-days">' + daysHTML() + '</div></div>';
  html += '<div class="field"><div class="field-lab"><span>备注</span><span class="hint">可选</span></div>'
    + '<input class="inp" id="ed-note" type="text" maxlength="40" placeholder="例如：随餐服用" autocomplete="off" value="' + esc(d.note) + '"></div>';
  if (d.id) {
    html += '<div class="danger-zone"><button class="btn-danger" type="button" id="ed-del">'
      + uiIcon('trash', 16) + '删除药品</button></div>';
  }
  $('#ed-body').innerHTML = html;
}
function refreshPickers() {
  if (!editing) return;
  const p = pickerHTML();
  const icons = $('#ed-icons');
  if (icons) icons.innerHTML = p.icons;
  const colors = $('#ed-colors');
  if (colors) colors.innerHTML = p.colors;
}
function syncTimesFromInputs() {
  if (!editing) return;
  const arr = [];
  $$('#ed-times .timeinp').forEach(function (inp) {
    const v = String(inp.value || '').slice(0, 5);
    if (/^\d{2}:\d{2}$/.test(v)) arr.push(v);
  });
  editing.times = arr.length ? uniqTimes(arr) : ['08:00'];
}
function rerenderTimes() {
  const box = $('#ed-times');
  if (box) box.innerHTML = timesHTML();
  const hint = $('#ed-time-hint');
  if (hint) hint.textContent = editing.times.length > 1 ? ('共 ' + editing.times.length + ' 次') : '至少 1 个';
}
function addTime() {
  syncTimesFromInputs();
  if (editing.times.length >= 6) { toast('一天最多 6 个提醒时间', 'peach', { icon: 'clock' }); return; }
  const last = editing.times[editing.times.length - 1] || '08:00';
  editing.times = uniqTimes(editing.times.concat([fmtHM(parseHM(last) + 120)]));
  rerenderTimes();
}
function removeTime(idx) {
  syncTimesFromInputs();
  if (editing.times.length <= 1) { toast('至少要保留一个提醒时间', 'peach', { icon: 'clock' }); return; }
  editing.times.splice(idx, 1);
  rerenderTimes();
}
function toggleDay(d) {
  const i = editing.days.indexOf(d);
  if (i >= 0) {
    if (editing.days.length <= 1) { toast('至少要选择一天', 'peach', { icon: 'calendar' }); return; }
    editing.days.splice(i, 1);
  } else {
    editing.days.push(d);
  }
  editing.days.sort(function (a, b) { return a - b; });
  const box = $('#ed-days');
  if (box) {
    Array.prototype.forEach.call(box.children, function (btn) {
      const v = +btn.getAttribute('data-day');
      btn.setAttribute('aria-pressed', editing.days.indexOf(v) >= 0 ? 'true' : 'false');
    });
  }
  const hint = $('#ed-days-hint');
  if (hint) hint.textContent = daysLabel(editing.days);
}
function shakeEl(el) {
  if (!el) return;
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  setTimeout(function () { el.classList.remove('shake'); }, 320);
}
function saveEditor() {
  if (!editing) return;
  const nameEl = $('#ed-name');
  const name = nameEl ? nameEl.value.trim() : '';
  if (!name) {
    shakeEl(nameEl);
    toast('请先填写药品名称', 'peach', { icon: 'close' });
    return;
  }
  syncTimesFromInputs();
  const doseEl = $('#ed-dose');
  const noteEl = $('#ed-note');
  const payload = {
    name: name,
    dose: doseEl ? doseEl.value.trim() : '',
    icon: editing.icon,
    color: editing.color,
    times: editing.times.slice(),
    days: editing.days.slice(),
    note: noteEl ? noteEl.value.trim() : ''
  };
  const isEdit = !!editing.id;
  if (isEdit) {
    const m = findMed(editing.id);
    if (m) Object.assign(m, payload);
  } else {
    state.meds.push(Object.assign({ id: newMedId(), createdAt: Date.now() }, payload));
  }
  save();
  renderAll();
  closeEditor();
  toast((isEdit ? '已保存 · ' : '已添加 · ') + name, 'mint', { icon: 'check' });
}
function deleteEditing() {
  if (!editing || !editing.id) return;
  const id = editing.id;
  const name = editing.name;
  dialog({
    title: '删除药品',
    body: '「' + esc(name) + '」以及它的打卡记录会被一起删除，<br>此操作无法撤销。',
    ok: '删除', danger: true, icon: 'trash'
  }).then(function (ok) {
    if (!ok) return;
    state.meds = state.meds.filter(function (m) { return m.id !== id; });
    Object.keys(state.logs).forEach(function (dk) {
      const day = state.logs[dk];
      Object.keys(day).forEach(function (k) { if (day[k] && day[k].medId === id) delete day[k]; });
      if (!Object.keys(day).length) delete state.logs[dk];
    });
    save();
    renderAll();
    closeEditor();
    toast('已删除 · ' + name, 'peach', { icon: 'trash' });
  });
}

/* =====================================================================
   13. 设置：开关 / 强调色 / 导出 / 清空 / 试听
   ===================================================================== */
function toggleSetting(key) {
  if (key === 'notify') {
    if (!('Notification' in window)) { toast('当前浏览器不支持通知，仍会弹页面横幅', 'peach', { icon: 'bell' }); return; }
    if (!state.settings.notify) {
      Notification.requestPermission().then(function (p) {
        const granted = (p === 'granted');
        state.settings.notify = granted;
        save();
        renderSettings();
        toast(granted ? '已允许通知' : '通知没有开启', granted ? 'mint' : 'peach', { icon: 'bell' });
      }).catch(function () { toast('通知授权失败', 'peach', { icon: 'bell' }); });
      return;
    }
    state.settings.notify = false;
    save();
    renderSettings();
    return;
  }
  state.settings[key] = !state.settings[key];
  save();
  renderSettings();
  if (key === 'sound' && state.settings.sound) chime(false);
}
function applyAccent() {
  const a = (state && state.settings) ? state.settings.accent : 'mint';
  const t = TONES[a] || TONES.mint;
  document.documentElement.style.setProperty('--accent', t.main);
  document.documentElement.style.setProperty('--accent-ink', LINE_DARK);
}
function setAccent(k) {
  if (ACCENTS.indexOf(k) < 0) return;
  state.settings.accent = k;
  save();
  applyAccent();
  renderSettings();
  chime(false);
  toast('强调色已切换', 'plain', { icon: 'star', ttl: 1600 });
}
function exportData() {
  try {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pixel-dose-' + dateKey(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2500);
    toast('已导出 JSON 备份', 'mint', { icon: 'share' });
  } catch (e) {
    toast('导出失败', 'peach', { icon: 'close' });
  }
}
function notifiedReset() {
  Object.keys(notifiedMap).forEach(function (k) { delete notifiedMap[k]; });
}
function clearAllData(skipConfirm) {
  const doIt = function () {
    const settings = state.settings;
    state = { meds: [], logs: {}, settings: settings, seeded: true };
    notifiedReset();
    Object.keys(snoozeUntil).forEach(function (k) { delete snoozeUntil[k]; });
    save();
    applyAccent();
    renderAll();
    switchTab('today');
    toast('数据已清空', 'peach', { icon: 'trash' });
  };
  if (skipConfirm) { doIt(); return Promise.resolve(true); }
  return dialog({
    title: '清空所有数据',
    body: '所有药品和打卡记录都会被删除，无法恢复。<br>建议先「导出数据」备份一份。',
    ok: '确定清空', danger: true, icon: 'trash'
  }).then(function (ok) { if (ok) doIt(); return ok; });
}
function testRemind() {
  const doses = dosesForDate(new Date());
  chime(false);
  setTimeout(function () { chime(false); }, 760);
  vibrate(30);
  if (doses.length) {
    setTimeout(function () { showBanner(doses[0], false); }, 320);
  } else {
    toast('先加一种药，再来试听提醒', 'peach', { icon: 'bell' });
  }
  if (state.settings.notify && ('Notification' in window) && Notification.permission === 'granted') {
    notifySystem('试听提醒', '像素药盒 · 到点就该这样提醒你');
  }
}

/* =====================================================================
   14. 事件
   ===================================================================== */
function shiftMonth(delta) {
  let m = histMonthM + delta, y = histMonthY;
  if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
  const now = new Date();
  if (y > now.getFullYear() || (y === now.getFullYear() && m > now.getMonth())) return;
  histMonthY = y; histMonthM = m;
  renderHistory();
}
function handleAction(el) {
  const a = el.getAttribute('data-act');
  if (a === 'check') { checkDose(el.getAttribute('data-dose-id'), el); return; }
  if (a === 'snooze') { snoozeDose(el.getAttribute('data-dose-id')); return; }
  if (a === 'banner-close') { hideBanner(); return; }
  if (a === 'banner-take') { const id = el.getAttribute('data-dose-id'); hideBanner(); checkDose(id, el); return; }
  if (a === 'sheet-close') { closeSheet(); return; }
  if (a === 'test-remind') { testRemind(); return; }
  if (a === 'export') { exportData(); return; }
  if (a === 'clear') { clearAllData(); return; }
}
function onClick(ev) {
  let t = ev.target;
  while (t && t.nodeType !== 1) t = t.parentNode;
  if (!t || !t.closest) return;

  const tabBtn = t.closest('[data-tab]');
  if (tabBtn) { switchTab(tabBtn.getAttribute('data-tab')); return; }

  const chk = t.closest('[data-check]');
  if (chk) { toggleCheck(chk.getAttribute('data-check'), chk); return; }

  const act = t.closest('[data-act]');
  if (act) { handleAction(act); return; }

  if (t.closest('#add-med') || t.closest('#empty-add')) { openEditor(null); return; }
  if (t.closest('#bell-btn')) { switchTab('settings'); return; }

  const medCard = t.closest('[data-med-id]');
  if (medCard) { openEditor(findMed(medCard.getAttribute('data-med-id'))); return; }

  const sw = t.closest('[data-toggle]');
  if (sw) { toggleSetting(sw.getAttribute('data-toggle')); return; }

  const acc = t.closest('[data-accent]');
  if (acc) { setAccent(acc.getAttribute('data-accent')); return; }

  if (t.closest('#cal-prev')) { shiftMonth(-1); return; }
  if (t.closest('#cal-next')) { shiftMonth(1); return; }

  const cell = t.closest('[data-date]');
  if (cell) { openDaySheet(cell.getAttribute('data-date')); return; }

  const pi = t.closest('[data-pick-icon]');
  if (pi) { if (editing) { editing.icon = pi.getAttribute('data-pick-icon'); refreshPickers(); } return; }
  const pc = t.closest('[data-pick-color]');
  if (pc) { if (editing) { editing.color = pc.getAttribute('data-pick-color'); refreshPickers(); } return; }
  const rmt = t.closest('[data-rm-time]');
  if (rmt) { removeTime(+rmt.getAttribute('data-rm-time')); return; }
  if (t.closest('#ed-addtime')) { addTime(); return; }
  const dayBtn = t.closest('[data-day]');
  if (dayBtn) { if (editing) toggleDay(+dayBtn.getAttribute('data-day')); return; }
  if (t.closest('#ed-cancel')) { closeEditor(); return; }
  if (t.closest('#ed-save')) { saveEditor(); return; }
  if (t.closest('#ed-del')) { deleteEditing(); return; }
}
function onInput(ev) {
  if (!editing) return;
  const el = ev.target;
  if (!el || !el.id) return;
  if (el.id === 'ed-name') editing.name = el.value;
  else if (el.id === 'ed-dose') editing.dose = el.value;
  else if (el.id === 'ed-note') editing.note = el.value;
}
function onChange(ev) {
  if (!editing) return;
  const el = ev.target;
  if (el && el.classList && el.classList.contains('timeinp')) syncTimesFromInputs();
}
function onKeyDown(ev) {
  if (ev.key !== 'Escape') return;
  if ($('#editor').getAttribute('data-open') === 'true') { closeEditor(); return; }
  if ($('#sheet').getAttribute('data-open') === 'true') { closeSheet(); return; }
  if ($('#banner').getAttribute('data-open') === 'true') { hideBanner(); return; }
}

/* =====================================================================
   15. tick / 跨天
   ===================================================================== */
function heroCountdownTick() {
  const el = $('#hero-countdown');
  if (!el || !heroTarget) return;
  const left = heroTarget - Date.now();
  if (left <= 1000) { renderToday(); return; }
  el.textContent = fmtDur(left);
}
function tick() {
  const now = new Date();
  const sb = $('#sb-time');
  if (sb) sb.textContent = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  const dk = dateKey(now);
  if (dk !== uiDate) {
    uiDate = dk;
    notifiedReset();
    renderAll();
    toast('新的一天 · 药单已刷新', 'plain', { icon: 'calendar', ttl: 2800 });
  }
  heroCountdownTick();
  checkDue(now);
}

/* =====================================================================
   16. 调试接口（spec §13）
   ===================================================================== */
function apiAddMed(med) {
  const m = sanitizeMed(Object.assign({ id: newMedId(), createdAt: Date.now() }, med || {}));
  if (!m) return null;
  state.meds.push(m);
  save();
  renderAll();
  return m;
}
function apiUpdateMed(id, patch) {
  const m = findMed(id);
  if (!m) return null;
  const merged = sanitizeMed(Object.assign({}, m, patch || {}));
  if (merged) {
    Object.keys(merged).forEach(function (k) { m[k] = merged[k]; });
    save();
    renderAll();
  }
  return m;
}
function apiDeleteMed(id) {
  const m = findMed(id);
  if (!m) return false;
  state.meds = state.meds.filter(function (x) { return x.id !== id; });
  Object.keys(state.logs).forEach(function (dk) {
    const day = state.logs[dk];
    Object.keys(day).forEach(function (k) { if (day[k] && day[k].medId === id) delete day[k]; });
    if (!Object.keys(day).length) delete state.logs[dk];
  });
  save();
  renderAll();
  return true;
}
function exposeApi() {
  window.__pixelDose = {
    get state() { return state; },
    save: function () { save(); },
    tick: function () { tick(); },
    checkDose: function (id) { return checkDose(id); },
    uncheckDose: function (id) { return uncheckDose(id); },
    addMed: function (med) { return apiAddMed(med); },
    updateMed: function (id, patch) { return apiUpdateMed(id, patch); },
    deleteMed: function (id) { return apiDeleteMed(id); },
    reset: function () { return clearAllData(true); },
    seed: function () { state = buildDemo(); save(); applyAccent(); renderAll(); return state; },
    clear: function () { return clearAllData(true); },
    go: function (tab) { switchTab(tab); },
    openDay: function (dk) { openDaySheet(dk); },
    closeDay: function () { closeSheet(); },
    notifyDose: function (id) { const d = doseByDoseId(id); if (d) { showBanner(d); return true; } return false; },
    closeBanner: function () { hideBanner(); },
    ring: function () { startRing(); },
    stopRing: function () { stopRing(); },
    toggleDose: function (id) { toggleCheck(id); },
    streak: function () { return streakDays(); },
    rate: function () { return onTimeRate(); }
  };
}

/* =====================================================================
   17. 启动
   ===================================================================== */
function boot() {
  state = loadState();
  if (!state) {
    state = buildDemo();
    save();
  }
  if (!state.settings) state.settings = defaultSettings();
  applyAccent();
  renderAll();
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKeyDown);
  const scrim = $('#scrim');
  if (scrim) scrim.addEventListener('click', closeSheet);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { uiDate = dateKey(new Date()); tick(); refreshAfterDoseChange(); renderSettings(); }
  });
  uiDate = dateKey(new Date());
  setInterval(tick, 1000);
  tick();
  exposeApi();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();

</script>
